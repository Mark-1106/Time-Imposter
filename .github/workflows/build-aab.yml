name: Build Android AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Inject AdMob IDs into web assets
        env:
          APP_ID: ${{ secrets.ADMOB_APP_ID }}
          INT_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          APP_ID="${APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          INT_ID="${INT_ID:-ca-app-pub-3940256099942544/1033173712}"
          BANNER_ID="${BANNER_ID:-ca-app-pub-3940256099942544/6300978111}"
          echo "Using AdMob App ID: $APP_ID"
          sed -i "s#__ADMOB_APP_ID__#${APP_ID}#g" www/index.html
          sed -i "s#__ADMOB_INTERSTITIAL_ID__#${INT_ID}#g" www/index.html
          sed -i "s#__ADMOB_BANNER_ID__#${BANNER_ID}#g" www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Bump target/compile SDK to API 36
        run: |
          VARS="android/variables.gradle"
          sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" "$VARS"
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" "$VARS"
          echo "--- variables.gradle after patch ---"
          cat "$VARS"

      - name: Patch AndroidManifest.xml for AdMob
        env:
          APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          APP_ID="${APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i "s#<application#<uses-permission android:name=\"com.google.android.gms.permission.AD_ID\"/>\n    <application#" "$MANIFEST"
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${APP_ID}\"/>\n    </application>#" "$MANIFEST"
          echo "--- Manifest after patch ---"
          cat "$MANIFEST"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate or decode signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          else
            echo "No keystore secret found — generating a new one automatically"
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias timeimposter \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "timeimposter123" -keypass "timeimposter123" \
              -dname "CN=Time Imposter, OU=App, O=TimeImposter, L=Seoul, ST=Seoul, C=KR"
          fi
          echo "Keystore file check:"
          ls -la android/app/release.keystore

      - name: Build signed release AAB
        working-directory: android
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_ENV: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${STORE_PASS:-timeimposter123}"
          KEY_ALIAS_ENV="${KEY_ALIAS_ENV:-timeimposter}"
          KEY_PASS="${KEY_PASS:-timeimposter123}"
          KEYSTORE_ABS="$(pwd)/app/release.keystore"
          echo "Using keystore at: $KEYSTORE_ABS"
          ls -la "$KEYSTORE_ABS"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_ABS" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS_ENV" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload AAB as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-imposter-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload keystore as backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THIS-keystore-backup
          path: android/app/release.keystore
