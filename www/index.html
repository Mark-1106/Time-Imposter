<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Time Imposter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+Arabic:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap');

:root{
  --bg:#0B0B14; --surface:#16141F; --surface2:#1E1B2B; --border:#2A2738;
  --text:#F4F1EA; --text-dim:#948FA3; --gold:#E8B84B; --gold-dim:#7A6530;
  --magenta:#FF3B5C; --magenta-dim:#6E1F2C; --cyan:#49D9E8; --cyan-dim:#215156;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;touch-action:manipulation;}
body{
  background:radial-gradient(120% 140% at 50% 0%, #17141F 0%, #0B0B14 55%, #08070C 100%);
  color:var(--text); font-family:'Space Grotesk',sans-serif; min-height:100vh; display:flex; justify-content:center;
}
body[dir="rtl"]{ font-family:'Noto Nastaliq Urdu','Noto Sans Arabic','Space Grotesk',sans-serif; }
#root{ width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; padding:64px 20px 90px; }
h1,h2,h3{margin:0;font-weight:700;}
p{margin:0;color:var(--text-dim);line-height:1.6;}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.brand-logo{width:52px;height:52px;border-radius:50%;flex-shrink:0;object-fit:cover;}
.brand .t1{font-size:1.5rem;font-weight:700;letter-spacing:-0.01em;}
.brand .t2{font-size:1.5rem;font-weight:700;color:var(--magenta);letter-spacing:-0.01em;}
.tagline{font-size:0.9rem;margin-bottom:16px;}

.lang-toggle{
  display:flex;align-items:center;gap:8px;width:auto;padding:10px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;
  font-family:'Space Grotesk',sans-serif;font-size:0.88rem;font-weight:600;margin-bottom:22px;
}
.lang-toggle .flag{font-size:1.1rem;}
.lang-toggle .caret{color:var(--text-dim);margin-left:2px;}
.lang-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:22px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lang-option{
  display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);cursor:pointer;font-size:0.86rem;font-weight:600;color:var(--text);
}
.lang-option.active{border-color:var(--gold);color:var(--gold);}
.lang-option .flag{font-size:1.15rem;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px;}

.btn{
  display:block;width:100%;padding:16px 20px;border-radius:14px;border:none;
  font-family:'Space Grotesk',sans-serif;font-size:1.02rem;font-weight:600;cursor:pointer;
  text-align:center;transition:transform 0.12s ease, opacity 0.12s ease;margin-bottom:12px;color:var(--bg);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
body[dir="rtl"] .btn{ font-family:'Noto Nastaliq Urdu','Noto Sans Arabic','Space Grotesk',sans-serif; }
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold);}
.btn-danger{background:var(--magenta); color:#fff;}
.btn-secondary{background:var(--cyan);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-big{padding:30px 20px;font-size:1.4rem;border-radius:20px;letter-spacing:0.04em;}
.btn[disabled]{opacity:0.35;pointer-events:none;}

.stepper{display:flex;gap:10px;margin-bottom:22px;}
.step-pill{
  flex:1;text-align:center;padding:14px 0;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;
  cursor:pointer;color:var(--text-dim);
}
.step-pill.active{border-color:var(--gold);color:var(--gold);background:var(--surface2);}

.name-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.name-row .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;}
.name-row input{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:0.95rem;
}
.name-row input:focus{outline:none;border-color:var(--gold);}

.center-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0;}
.pass-icon{font-size:2.6rem;margin-bottom:18px;}
.pass-title{font-size:1.3rem;margin-bottom:8px;}
.pass-sub{font-size:0.92rem;max-width:280px;margin:0 auto 30px;}

.role-badge{
  font-family:'JetBrains Mono',monospace;font-size:0.85rem;letter-spacing:0.08em;
  padding:6px 14px;border-radius:999px;margin-bottom:22px;display:inline-block;
}
body[dir="rtl"] .role-badge{ font-family:'Noto Nastaliq Urdu','Noto Sans Arabic',sans-serif; }
.role-badge.crew{background:var(--cyan-dim);color:var(--cyan);}
.role-badge.imp{background:var(--magenta-dim);color:var(--magenta);}

.target-display{
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:clamp(3.4rem,17vw,4.6rem);
  letter-spacing:0.02em;color:var(--gold);text-shadow:0 0 28px rgba(232,184,75,0.35);margin-bottom:6px;
}
.target-unit{font-family:'JetBrains Mono',monospace;color:var(--text-dim);font-size:0.85rem;letter-spacing:0.15em;margin-bottom:28px;}
.imp-message{font-size:1.15rem;font-weight:600;max-width:280px;margin:0 auto 30px;line-height:1.6;}

.stopwatch-display{
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:clamp(3.6rem,18vw,5rem);
  letter-spacing:0.02em;margin-bottom:6px;transition:color 0.2s ease;
}
.stopwatch-display.idle{color:var(--text-dim);}
.stopwatch-display.running{color:var(--magenta); text-shadow:0 0 32px rgba(255,59,92,0.45); animation:pulse 1s infinite ease-in-out;}
.stopwatch-display.stopped{color:var(--cyan); text-shadow:0 0 28px rgba(73,217,232,0.4);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
.sw-hint{font-size:0.88rem;margin-bottom:34px;}

.tally-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--border);}
.tally-row:last-child{border-bottom:none;}
.tally-name{font-weight:600;}
.tally-time{font-family:'JetBrains Mono',monospace;color:var(--text-dim);font-size:0.9rem;}
.tally-badge{font-family:'JetBrains Mono',monospace;font-size:0.75rem;padding:3px 9px;border-radius:999px;margin-left:8px;margin-right:8px;}
.tally-badge.imp{background:var(--magenta-dim);color:var(--magenta);}
.tally-badge.caught{background:var(--gold-dim);color:var(--gold);}

.pick-option{
  display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;
  border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--text);
  font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;margin-bottom:10px;cursor:pointer;
}
.pick-option:active{transform:scale(0.98);}
.pick-option.selected{border-color:var(--magenta);background:rgba(255,59,92,0.12);color:var(--magenta);}
.pick-check{font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--text-dim);}
.pick-option.selected .pick-check{color:var(--magenta);}

.section-label{font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;color:var(--text-dim);margin-bottom:10px;}
.result-hero{text-align:center;padding:8px 0 22px;}
.result-hero .big{font-size:1.4rem;font-weight:700;margin-bottom:8px;}
.result-hero .sub{font-size:0.92rem;}
.footer-note{text-align:center;font-size:0.78rem;color:var(--text-dim);margin-top:10px;line-height:1.6;}
.link-btn{background:none;border:none;color:var(--cyan);font-family:'Space Grotesk',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;padding:4px;}

.modal-overlay{position:fixed;inset:0;background:rgba(8,7,12,0.88);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;}
.rule-item{margin-bottom:14px;}
.rule-item .num{color:var(--gold); font-family:'JetBrains Mono',monospace; font-weight:700; margin-right:6px;}
body[dir="rtl"] .rule-item .num{ margin-right:0; margin-left:6px; }

.verdict-splash{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:40px;z-index:60;transition:transform 0.42s cubic-bezier(.5,0,.5,1), opacity 0.4s ease;
  transform:scale(1);opacity:1;
}
.verdict-splash.shrink{transform:scale(0.78);opacity:0;}
.verdict-splash.lose{background:radial-gradient(120% 120% at 50% 40%, #34121D 0%, #0B0B14 60%, #08070C 100%);}
.verdict-splash.win{background:radial-gradient(120% 120% at 50% 40%, #332911 0%, #0B0B14 60%, #08070C 100%);}
.verdict-splash.partial{background:radial-gradient(120% 120% at 50% 40%, #14262B 0%, #0B0B14 60%, #08070C 100%);}
.verdict-text{
  font-family:'Space Grotesk',sans-serif;font-weight:800;line-height:1.3;
  font-size:clamp(1.9rem,9vw,3rem);
}
.verdict-splash.lose .verdict-text{color:var(--magenta);text-shadow:0 0 40px rgba(255,59,92,0.4);}
.verdict-splash.win .verdict-text{color:var(--gold);text-shadow:0 0 40px rgba(232,184,75,0.4);}
.verdict-splash.partial .verdict-text{color:var(--cyan);text-shadow:0 0 40px rgba(73,217,232,0.35);}

.exit-link{
  display:block;width:100%;text-align:center;background:none;border:none;
  color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-size:0.85rem;
  padding:10px;margin-top:6px;cursor:pointer;touch-action:manipulation;
}
</style>
</head>

let audioCtx = null;
function playStartSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const dur = 0.25; const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(340, now);
    o.frequency.linearRampToValueAtTime(370, now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.5, now + 0.02);
    g.gain.setValueAtTime(0.5, now + dur - 0.06);
    g.gain.linearRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(now + dur + 0.02);
  }catch(e){}
}
function playStopSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 950;
    g.gain.setValueAtTime(0.32, now);
    g.gain.setValueAtTime(0.32, now + 0.045);
    g.gain.linearRampToValueAtTime(0.0001, now + 0.055);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(now + 0.06);
  }catch(e){}
}
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
function startBeep(){ playStartSound(); vibrate(90); }
function stopBeep(){ playStopSound(); vibrate(30); }

function uid(){ return Math.random().toString(36).slice(2,9); }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function genTarget(){
  const r = Math.random(); let x;
  if(r < 0.15) x = 0.10 + Math.random()*0.89;
  else if(r < 0.90) x = 1 + Math.random()*9;
  else x = 10 + Math.random()*10;
  return Math.round(x*100)/100;
}
function fmtTime(sec){
  const s = Math.floor(sec); const cs = Math.round((sec - s)*100);
  let csStr = cs.toString().padStart(2,'0');
  if(csStr === '100'){ return (s+1).toString().padStart(2,'0') + '.00'; }
  return s.toString().padStart(2,'0') + '.' + csStr;
}
function playerName(id){ const p = S.players.find(p=>p.id===id); return p ? p.name : '?'; }
function imposterCount(){ return S.playerCount <= 4 ? 1 : 2; }

function resetGame(){
  const n = S.playerCount; const players = [];
  for(let i=0;i<n;i++){ players.push({id: uid(), name: 'P' + (i+1)}); }
  S.players = players;
}
function initSetupToRound(){
  const n = imposterCount();
  const shuffled = shuffle(S.players.map(p=>p.id));
  S.imposterIds = shuffled.slice(0, n);
  S.target = genTarget();
  S.roleOrder = S.players.map(p=>p.id);
  S.roleIndex = 0;
  S.order = []; S.turnIndex = 0;
  S.times = {}; S.swState = 'idle'; S.investigated = {};
  S.recheckId = null; S.accuseSelected = []; S.accuseConfirming = false;
  S.finalAccused = []; S.extraDrinkPick = {}; S.phase = 'pass-role';
  render();
}
function currentRolePlayerId(){ return S.roleOrder[S.roleIndex]; }
function currentPlayerId(){ return S.order[S.turnIndex]; }
function afterRoleReveal(){
  S.roleIndex++;
  if(S.roleIndex >= S.roleOrder.length){
    S.order = shuffle(S.players.map(p=>p.id));
    S.turnIndex = 0;
    S.phase = 'placedown';
  } else {
    S.phase = 'pass-role';
  }
  render();
}

function startStopwatch(){ S.swState = 'running'; S.swStart = performance.now(); startBeep(); render(); }
function stopStopwatch(){ S.swElapsed = (performance.now() - S.swStart)/1000; S.swState = 'stopped'; stopBeep(); render(); }
function retryStopwatch(){ S.swState = 'idle'; S.swElapsed = 0; render(); }
function confirmAndNext(){
  S.times[currentPlayerId()] = S.swElapsed;
  S.turnIndex++; S.swState = 'idle'; S.swElapsed = 0;
  S.phase = (S.turnIndex >= S.order.length) ? 'investigate' : 'turn';
  render();
}
function openRecheck(id){ S.recheckId = id; S.recheckSw = 'idle'; render(); }
function recheckStart(){ S.recheckSw = 'running'; startBeep(); render(); }
function recheckStop(){ S.recheckSw = 'stopped'; stopBeep(); render(); }
function closeRecheck(){ S.investigated[S.recheckId] = true; S.recheckId = null; render(); }
function proceedToAccuse(){ S.phase = 'accuse'; S.accuseSelected = []; S.accuseConfirming = false; render(); }
function toggleAccuse(id){
  const N = imposterCount(); const idx = S.accuseSelected.indexOf(id);
  if(idx >= 0){ S.accuseSelected.splice(idx,1); } else { if(S.accuseSelected.length < N) S.accuseSelected.push(id); }
  render();
}
function openAccuseConfirm(){ if(S.accuseSelected.length === imposterCount()) { S.accuseConfirming = true; render(); } }
function cancelAccuseConfirm(){ S.accuseConfirming = false; render(); }
function finalizeAccusation(){
  S.finalAccused = S.accuseSelected.slice();
  const accusedSet = new Set(S.finalAccused); const impSet = new Set(S.imposterIds);
  S.caughtIds = S.finalAccused.filter(id => impSet.has(id));
  S.uncaughtIds = S.imposterIds.filter(id => !accusedSet.has(id));
  S.pickerImposterId = null;
  if(S.uncaughtIds.length === 0) S.verdictType = 'lose';
  else if(S.caughtIds.length === 0) S.verdictType = 'win';
  else S.verdictType = 'partial';
  S.verdictShrink = false;
  S.phase = 'verdict'; render();
  setTimeout(function(){ S.verdictShrink = true; render(); }, 3000);
  setTimeout(function(){ S.phase = 'reveal'; render(); }, 3450);
}
function pickExtraDrinker(pid){
  S.extraDrinkPick[S.pickerImposterId] = pid;
  const idx = S.uncaughtIds.indexOf(S.pickerImposterId);
  S.pickerImposterId = (idx < S.uncaughtIds.length - 1) ? S.uncaughtIds[idx+1] : null;
  render();
}

  if(S.langMenuOpen){
    const opts = Object.keys(I18N).map(l => '<div class="lang-option '+(S.lang===l?'active':'')+'" onclick="setLang(\''+l+'\')"><span class="flag">'+I18N[l].flag+'</span><span>'+I18N[l].name+'</span></div>').join('');
    langPanel = '<div class="lang-panel">'+opts+'</div>';
  }
  const nameRows = S.players.map((p,i) => '<div class="name-row"><div class="dot"></div><input value="'+p.name+'" data-idx="'+i+'" oninput="onNameInput(event)" maxlength="14"/></div>').join('');
  return '<div class="brand"><img src="data:image/png;base64,'+LOGO_B64+'" class="brand-logo" alt="logo"/><span class="t1">'+t('brand1')+'</span><span class="t2">'+t('brand2')+'</span></div>'
    +langBtn+langPanel
    +'<div class="card"><div class="section-label">'+t('players')+'</div><div class="stepper">'
    +[3,4,5,6].map(n => '<div class="step-pill '+(S.playerCount===n?'active':'')+'" onclick="setPlayerCount('+n+')">'+n+'</div>').join('')
    +'</div><p style="margin-bottom:16px;font-size:0.85rem;">'+t('impCountText')(imposterCount(),S.playerCount)+'</p>'
    +'<div id="nameRows">'+nameRows+'</div></div>'
    +'<button class="btn btn-primary" onclick="onStartGame()">'+t('startGame')+'</button>'
    +'<button class="btn btn-ghost" onclick="toggleRules(true)">'+t('howToPlay')+'</button>'
    +'<button class="exit-link" onclick="openExitConfirm()">'+t('exitGameBtn')+'</button>'
    +(S.showRules ? renderRulesModal() : '');
}
function renderRulesModal(){
  const allRules = t('rules');
  const firstPageSize = 7, restPageSize = 6;
  const totalPages = allRules.length <= firstPageSize ? 1 : 1 + Math.ceil((allRules.length - firstPageSize) / restPageSize);
  const start = S.rulesPage === 0 ? 0 : firstPageSize + (S.rulesPage - 1) * restPageSize;
  const pageLen = S.rulesPage === 0 ? firstPageSize : restPageSize;
  const pageItems = allRules.slice(start, start + pageLen);
  const items = pageItems.map((r,i) => '<div class="rule-item"><span class="num">'+(start+i+1)+'</span>'+r+'</div>').join('');
  const isLastPage = S.rulesPage >= totalPages - 1;
  const navBtn = isLastPage
    ? '<button class="btn btn-primary" style="margin-top:8px;" onclick="toggleRules(false)">'+t('gotIt')+'</button>'
    : '<button class="btn btn-primary" style="margin-top:8px;" onclick="nextRulesPage()">'+t('nextBtn')+'</button>';
  const dots = totalPages > 1 ? '<div style="text-align:center;margin-bottom:4px;color:var(--text-dim);font-family:\'JetBrains Mono\',monospace;font-size:0.75rem;">'+(S.rulesPage+1)+' / '+totalPages+'</div>' : '';
  return '<div class="modal-overlay" onclick="onOverlayClick(event)"><div class="modal-box"><h3 style="margin-bottom:16px;">'+t('rulesTitle')+'</h3>'+items+dots+navBtn+'</div></div>';
}
function renderPassRole(){
  const pid = currentRolePlayerId();
  return '<div class="center-stage"><div class="pass-icon">\u{1F92B}</div><div class="pass-title">'+t('passPhoneTo')+'</div>'
    +'<div class="pass-title" style="color:var(--gold);font-size:1.6rem;margin-bottom:8px;">'+playerName(pid)+'</div>'
    +'<div class="pass-sub">'+t('noPeek')+'</div>'
    +'<button class="btn btn-primary" style="max-width:260px;" onclick="revealRole()">'+t('reveal')(playerName(pid))+'</button></div>';
}
function renderRole(){
  const pid = currentRolePlayerId(); const isImp = S.imposterIds.includes(pid);
  let body;
  if(isImp){ body = '<div class="role-badge imp">'+t('youAreImposter')+'</div><div class="imp-message">'+t('impMsg')+'</div>'; }
  else { body = '<div class="role-badge crew">'+t('yourTarget')+'</div><div class="target-display">'+fmtTime(S.target)+'</div><div class="target-unit">'+t('seconds')+'</div>'; }
  return '<div class="center-stage">'+body+'<button class="btn btn-primary" style="max-width:260px;" onclick="afterRoleReveal()">'+t('ready')+'</button></div>';
}
function renderPlaceDown(){
  return '<div class="center-stage"><div class="pass-icon">\u{1F4F1}</div><div class="pass-title">'+t('placeDownTitle')+'</div>'
    +'<div class="pass-sub">'+t('placeDownSub')+'</div>'
    +'<button class="btn btn-primary" style="max-width:260px;" onclick="goToTurn()">'+t('continueBtn')+'</button></div>';
}
function renderTurn(){
  const pid = currentPlayerId();
  return '<div class="center-stage"><div class="pass-title" style="color:var(--gold);font-size:1.6rem;margin-bottom:26px;">'+t('turnOf')(playerName(pid))+'</div>'
    +'<button class="btn btn-primary" style="max-width:260px;" onclick="goToStopwatch()">'+t('continueBtn')+'</button></div>';
}
function renderStopwatch(){
  const pid = currentPlayerId();
  let display = '00.00'; let cls = 'idle';
  if(S.swState === 'running'){ display = '\u2012\u2012.\u2012\u2012'; cls = 'running'; }
  else if(S.swState === 'stopped'){ display = '\u2012\u2012.\u2012\u2012'; cls = 'stopped'; }
  let controls = '';
  if(S.swState === 'idle'){ controls = '<button class="btn btn-danger btn-big" onclick="startStopwatch()">'+t('startBtn')+'</button>'; }
  else if(S.swState === 'running'){ controls = '<button class="btn btn-secondary btn-big" onclick="stopStopwatch()">'+t('stopBtn')+'</button>'; }
  else { controls = '<button class="btn btn-primary" onclick="confirmAndNext()">'+t('confirmNext')+'</button><button class="btn btn-ghost" onclick="retryStopwatch()">'+t('retry')+'</button>'; }
  const hint = S.swState==='idle' ? t('hintIdle') : '';
  return '<div class="center-stage"><div style="font-size:0.9rem;color:var(--text-dim);margin-bottom:6px;">'+t('turnOf')(playerName(pid))+'</div>'
    +'<div class="stopwatch-display '+cls+'">'+display+'</div><div class="sw-hint">'+hint+'</div>'+controls+'</div>';
}
function renderInvestigate(){
  const rows = S.players.map(p => '<div class="tally-row"><div class="tally-name">'+p.name+' '+(S.investigated[p.id] ? '<span class="tally-badge caught">'+t('rechecked')+'</span>' : '')+'</div>'
    +'<button class="link-btn" onclick="openRecheck(\''+p.id+'\')" '+(S.investigated[p.id] ? 'disabled style="opacity:0.35;pointer-events:none;"' : '')+'>'+t('recheckBtn')+'</button></div>').join('');
  return '<div><h2 style="margin-bottom:6px;">'+t('investigationTitle')+'</h2><p style="margin-bottom:22px;">'+t('investigationSub')+'</p>'
    +'<div class="card">'+rows+'</div><button class="btn btn-primary" onclick="proceedToAccuse()">'+t('proceedAccuse')+'</button></div>'
    +(S.recheckId ? renderRecheckModal() : '');
}
function renderRecheckModal(){
  const name = playerName(S.recheckId);
  let display = '00.00'; let cls = 'idle';
  if(S.recheckSw === 'running'){ display = '\u2012\u2012.\u2012\u2012'; cls = 'running'; }
  else if(S.recheckSw === 'stopped'){ display = '\u2012\u2012.\u2012\u2012'; cls = 'stopped'; }
  let controls = '';
  if(S.recheckSw === 'idle'){ controls = '<button class="btn btn-danger btn-big" onclick="recheckStart()">'+t('startBtn')+'</button>'; }
  else if(S.recheckSw === 'running'){ controls = '<button class="btn btn-secondary btn-big" onclick="recheckStop()">'+t('stopBtn')+'</button>'; }
  else { controls = '<button class="btn btn-primary" onclick="closeRecheck()">'+t('doneWatching')+'</button>'; }
  return '<div class="modal-overlay"><div class="modal-box" style="text-align:center;"><div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:14px;">'+t('recheckWatching')(name)+'</div>'
    +'<div class="stopwatch-display '+cls+'" style="font-size:2.8rem;margin-bottom:20px;">'+display+'</div>'+controls+'</div></div>';
}
function renderAccuse(){
  const N = imposterCount();
  const options = S.players.map(p => {
    const sel = S.accuseSelected.includes(p.id);
    return '<div class="pick-option '+(sel?'selected':'')+'" onclick="toggleAccuse(\''+p.id+'\')"><span>'+p.name+'</span><span class="pick-check">'+(sel?'\u2713':'')+'</span></div>';
  }).join('');
  const canConfirm = S.accuseSelected.length === N;
  let modal = '';
  if(S.accuseConfirming){
    const names = S.accuseSelected.map(playerName).join(' & ');
    const q = N > 1 ? t('confirmAccuseQPlural')(names) : t('confirmAccuseQ')(names);
    modal = '<div class="modal-overlay"><div class="modal-box" style="text-align:center;"><p style="margin-bottom:20px;font-size:1.05rem;color:var(--text);">'+q+'</p>'
      +'<button class="btn btn-danger" onclick="finalizeAccusation()">'+t('confirmBtn')+'</button>'
      +'<button class="btn btn-ghost" onclick="cancelAccuseConfirm()">'+t('changeBtn')+'</button></div></div>';
  }
  return '<div><h2 style="margin-bottom:6px;">'+t('accuseTitle')+'</h2><p style="margin-bottom:20px;">'+(N>1?t('accuseSub2'):t('accuseSub1'))+'</p>'
    +'<div style="margin-bottom:16px;">'+options+'</div>'
    +'<button class="btn btn-primary" '+(canConfirm?'':'disabled')+' onclick="openAccuseConfirm()">'+t('confirmBtn')+'</button></div>'+modal;
}
function renderVerdictSplash(){
  const key = S.verdictType === 'lose' ? 'verdictLose' : S.verdictType === 'win' ? 'verdictWin' : 'verdictPartial';
  return '<div class="verdict-splash '+S.verdictType+(S.verdictShrink?' shrink':'')+'"><div class="verdict-text">'+t(key)+'</div></div>';
}
function renderReveal(){
  const rows = S.players.map(p => {
    const isImp = S.imposterIds.includes(p.id);
    const time = S.times[p.id];
    const delta = isImp ? '' : '<span class="tally-time">'+t('off')(Math.abs(time - S.target).toFixed(2))+'</span>';
    return '<div class="tally-row"><div><div class="tally-name">'+p.name+' '+(isImp?'<span class="tally-badge imp">'+t('imposterBadge')+'</span>':'')+'</div>'
      +'<div class="tally-time">'+t('stoppedAt')(fmtTime(time))+'</div></div>'+delta+'</div>';
  }).join('');
  const allCaught = S.uncaughtIds.length === 0; const noneCaught = S.caughtIds.length === 0;
  let verdict;
  if(allCaught){
    const names = S.imposterIds.map(playerName).join(' & ');
    verdict = '<div class="big">'+t('busted')+'</div><div class="sub">'+(S.imposterIds.length>1?t('bustedSubPlural')(names):t('bustedSub')(names))+'</div>';
  } else if(noneCaught){
    verdict = '<div class="big">'+t('cleanGetaway')+'</div><div class="sub">'+t('cleanSub')+'</div>';
  } else {
    verdict = '<div class="big">'+t('halfRight')+'</div><div class="sub">'+t('halfSub')(S.caughtIds.map(playerName).join(', '), S.uncaughtIds.map(playerName).join(', '))+'</div>';
  }
  return '<div><div class="result-hero">'+verdict+'</div><div class="card" style="margin-bottom:10px;"><div class="section-label">'+t('targetWas')(fmtTime(S.target))+'</div>'+rows+'</div>'
    +'<button class="btn btn-primary" onclick="newRound()">'+t('nextRound')+'</button><button class="btn btn-ghost" onclick="newGame()">'+t('newGame')+'</button>'
    +'<button class="exit-link" onclick="openExitConfirm()">'+t('exitGameBtn')+'</button></div>';
}
function render(){
  document.body.setAttribute('dir', I18N[S.lang].rtl ? 'rtl' : 'ltr');
  const root = document.getElementById('root');
  let content = '';
  switch(S.phase){
    case 'setup': content = renderSetup(); break;
    case 'pass-role': content = renderPassRole(); break;
    case 'role': content = renderRole(); break;
    case 'placedown': content = renderPlaceDown(); break;
    case 'turn': content = renderTurn(); break;
    case 'stopwatch': content = renderStopwatch(); break;
    case 'investigate': content = renderInvestigate(); break;
    case 'accuse': content = renderAccuse(); break;
    case 'verdict': content = renderVerdictSplash(); break;
    case 'reveal': content = renderReveal(); break;
  }
  if(S.showExitConfirm){
    content += '<div class="modal-overlay"><div class="modal-box" style="text-align:center;">'
      +'<p style="margin-bottom:20px;font-size:1.05rem;color:var(--text);">'+t('exitConfirmQ')+'</p>'
      +'<button class="btn btn-danger" onclick="confirmExit()">'+t('exitConfirmYes')+'</button>'
      +'<button class="btn btn-ghost" onclick="closeExitConfirm()">'+t('exitConfirmNo')+'</button>'
      +'</div></div>';
  }
  root.innerHTML = content;
}
function openExitConfirm(){ S.showExitConfirm = true; render(); }
function closeExitConfirm(){ S.showExitConfirm = false; render(); }
function confirmExit(){
  S.showExitConfirm = false;
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App && window.Capacitor.Plugins.App.exitApp){
      window.Capacitor.Plugins.App.exitApp();
      return;
    }
  }catch(e){}
  try{ window.close(); }catch(e){}
  render();
}

// ---------- AdMob (interstitial between rounds + bottom banner) ----------
const ADMOB_APP_ID = '__ADMOB_APP_ID__';
const ADMOB_INTERSTITIAL_ID = '__ADMOB_INTERSTITIAL_ID__';
const ADMOB_BANNER_ID = '__ADMOB_BANNER_ID__';
let admobReady = false;
let interstitialLoaded = false;
async function initAdMob(){
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob){
      await window.Capacitor.Plugins.AdMob.initialize({});
      admobReady = true;
      loadInterstitial();
      showBannerAd();
    }
  }catch(e){}
}
async function loadInterstitial(){
  try{
    if(!admobReady) return;
    await window.Capacitor.Plugins.AdMob.prepareInterstitial({ adId: ADMOB_INTERSTITIAL_ID });
    interstitialLoaded = true;
  }catch(e){}
}
async function maybeShowInterstitial(){
  try{
    if(admobReady && interstitialLoaded){
      interstitialLoaded = false;
      await window.Capacitor.Plugins.AdMob.showInterstitial();
      loadInterstitial();
    }
  }catch(e){}
}
async function showBannerAd(){
  try{
    if(!admobReady) return;
    await window.Capacitor.Plugins.AdMob.showBanner({
      adId: ADMOB_BANNER_ID,
      adSize: 'BANNER',
      position: 'BOTTOM_CENTER',
      margin: 0
    });
  }catch(e){}
}
function setPlayerCount(n){ S.playerCount = n; render(); }
function onNameInput(e){ const idx = parseInt(e.target.getAttribute('data-idx')); S.players[idx].name = e.target.value || ('P' + (idx+1)); }
function onStartGame(){ initSetupToRound(); }
function revealRole(){ S.phase = 'role'; render(); }
function goToPlaceDown(){ S.phase = 'placedown'; render(); }
function goToTurn(){ S.phase = 'turn'; render(); }
function goToStopwatch(){ S.phase = 'stopwatch'; render(); }
function toggleRules(v){ S.showRules = v; S.rulesPage = 0; render(); }
function nextRulesPage(){ S.rulesPage++; render(); }
function onOverlayClick(e){ if(e.target.classList.contains('modal-overlay')) toggleRules(false); }

resetGame();
render();
initAdMob();
</script>
</body>
</html>
